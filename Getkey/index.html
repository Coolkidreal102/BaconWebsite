<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaconHub - Select Key Provider</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f0c',
                        cardBg: '#121814',
                        cardBorder: '#1e2820',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f0c;
            color: #e5e7eb;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .glass-nav {
            background: rgba(12, 18, 14, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .provider-workink:hover {
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.25);
            border-color: #00ff66;
        }
        .provider-lootlabs:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
            border-color: #a855f7;
        }
        /* Floating background logo animation */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .floating-bg-logo {
            animation: floatLogo 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Navigation Bar -->
    <header class="fixed top-4 left-0 right-0 z-40 flex justify-center px-4">
        <nav class="glass-nav rounded-full px-6 py-3 flex items-center justify-between w-full max-w-5xl shadow-2xl">
            <a href="../index.html" class="flex items-center space-x-2.5 group">
                <div id="nav-logo-box" class="w-8 h-8 rounded-lg border flex items-center justify-center transition-transform group-hover:scale-105">
                    <i id="nav-logo-icon" class="fa-solid fa-b text-lg"></i>
                </div>
                <span class="font-extrabold text-lg tracking-wide text-white">BaconHub</span>
            </a>

            <div class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-300">
                <a href="../index.html#features" class="nav-link hover:opacity-85 transition-colors">Features</a>
                <a href="../index.html#games" class="nav-link hover:opacity-85 transition-colors">Games</a>
                <a href="../index.html#reviews" class="nav-link hover:opacity-85 transition-colors">Reviews</a>
                <a href="../index.html#exploits" class="nav-link hover:opacity-85 transition-colors">Exploits</a>
                <a href="../index.html#faq" class="nav-link hover:opacity-85 transition-colors">FAQ</a>
            </div>

            <a id="nav-btn" href="../index.html#premium" class="font-bold px-5 py-2 rounded-full text-sm transition-all shadow-lg transform hover:-translate-y-0.5">
                Buy Premium
            </a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow pt-36 pb-20 flex flex-col items-center justify-center px-4 relative">
        <!-- Background ambient glow -->
        <div id="ambient-glow" class="absolute w-96 h-96 rounded-full blur-3xl pointer-events-none transition-all duration-700"></div>

        <!-- Floating Background 'B' Logo (Dynamic Color) -->
        <div class="absolute flex items-center justify-center pointer-events-none opacity-20 z-0">
            <div id="floating-b" class="floating-bg-logo w-44 h-44 rounded-3xl border-2 flex items-center justify-center text-8xl font-black">
                B
            </div>
        </div>

        <div class="text-center max-w-2xl mx-auto mb-12 relative z-10">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-4">
                Select <span id="title-highlight" class="transition-all duration-700">Key Provider</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base">
                Choose your preferred method to obtain a key. All providers are secure and fast.
            </p>
        </div>

        <!-- 2 Providers Grid (Work.ink & LootLabs) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl relative z-10 mb-8">
            <!-- Work.ink -->
            <a href="https://work.ink/your-link-here" target="_blank" class="provider-workink bg-cardBg border border-brandGreen/40 rounded-2xl p-8 flex flex-col items-center justify-center transition-all group">
                <span class="text-brandGreen font-extrabold text-xl tracking-wide group-hover:scale-105 transition-transform">work.ink</span>
            </a>

            <!-- LootLabs -->
            <a href="https://lootlabs.gg/your-link-here" target="_blank" class="provider-lootlabs bg-cardBg border border-purple-500/40 rounded-2xl p-8 flex flex-col items-center justify-center transition-all group">
                <span class="text-purple-400 font-extrabold text-xl tracking-wide group-hover:scale-105 transition-transform">LootLabs</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-cardBorder py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 BaconHub. All rights reserved. Not affiliated with Roblox Corporation.</p>
    </footer>

    <!-- Script to randomize or alternate themes on every refresh (Green <-> Purple) -->
    <script>
        // Array of themes: Green theme vs Purple theme
        const themes = [
            {
                name: 'green',
                colorCode: '#00ff66',
                glowClass: 'bg-[#00ff66]/10 shadow-[0_0_50px_rgba(0,255,102,0.3)]',
                textShadow: '0 0 25px rgba(0, 255, 102, 0.4)',
                borderClass: 'border-[#00ff66]',
                bgBox: 'bg-[#00ff66]/20 text-[#00ff66] border-[#00ff66]/40',
                btnClass: 'bg-[#00ff66] hover:bg-[#00cc52] text-[#0b0f0c] shadow-[#00ff66]/30'
            },
            {
                name: 'purple',
                colorCode: '#a855f7',
                glowClass: 'bg-[#a855f7]/10 shadow-[0_0_50px_rgba(168,85,247,0.3)]',
                textShadow: '0 0 25px rgba(168, 85, 247, 0.4)',
                borderClass: 'border-[#a855f7]',
                bgBox: 'bg-[#a855f7]/20 text-[#a855f7] border-[#a855f7]/40',
                btnClass: 'bg-[#a855f7] hover:bg-[#9333ea] text-white shadow-[#a855f7]/30'
            }
        ];

        // Randomly pick a theme every time the page loads / refreshes
        const randomTheme = themes[Math.floor(Math.random() * themes.length)];

        // Apply theme elements
        document.getElementById('ambient-glow').className = `absolute w-96 h-96 rounded-full blur-3xl pointer-events-none transition-all duration-700 ${randomTheme.glowClass}`;
        
        const floatingB = document.getElementById('floating-b');
        floatingB.className = `floating-bg-logo w-44 h-44 rounded-3xl border-2 flex items-center justify-center text-8xl font-black ${randomTheme.bgBox}`;
        floatingB.style.boxShadow = randomTheme.textShadow;

        const titleHighlight = document.getElementById('title-highlight');
        titleHighlight.style.color = randomTheme.colorCode;
        titleHighlight.style.textShadow = randomTheme.textShadow;

        const navLogoBox = document.getElementById('nav-logo-box');
        navLogoBox.className = `w-8 h-8 rounded-lg border flex items-center justify-center transition-transform group-hover:scale-105 ${randomTheme.bgBox}`;

        const navBtn = document.getElementById('nav-btn');
        navBtn.className = `font-bold px-5 py-2 rounded-full text-sm transition-all shadow-lg transform hover:-translate-y-0.5 ${randomTheme.btnClass}`;
    </script>
</body>
</html>
