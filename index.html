<!DOCTYPE html>
<html>
<head>
    <title>Bacon Hub | Key System</title>
    <style>
        body { background: #111; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 100px; }
        .box { background: #222; padding: 40px; border-radius: 15px; display: inline-block; border: 2px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; margin-bottom: 5px; }
        #timer { font-size: 50px; color: #ff4b4b; font-weight: bold; margin: 20px; }
        .key-box { display: none; margin-top: 20px; padding: 15px; background: #000; border: 1px dashed #00ff00; }
        #keyText { color: #00ff00; font-size: 32px; font-weight: bold; }
        .btn { background: #ffcc00; color: #000; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>BACON HUB</h1>
        <p style="color: #888;">By Bacon</p>
        <p>Your daily key is unlocking...</p>
        <div id="timer">01:05</div>
        
        <div id="key-box" class="key-box">
            <p>Your Key:</p>
            <div id="keyText">GENERATING...</div>
            <button class="btn" onclick="copyKey()">Copy Key</button>
        </div>
    </div>

    <script>
        let time = 65;
        const timerDisplay = document.getElementById('timer');
        const keyBox = document.getElementById('key-box');
        const keyText = document.getElementById('keyText');

        const countdown = setInterval(() => {
            time--;
            let m = Math.floor(time / 60);
            let s = time % 60;
            timerDisplay.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

            if (time <= 0) {
                clearInterval(countdown);
                timerDisplay.style.display = 'none';
                
                // MATH FORMULA (Must match Roblox script)
                const d = new Date();
                const seed = d.getFullYear() + (d.getMonth() + 1) + d.getDate();
                const finalKey = "Bacon_" + (seed * 99);
                
                keyText.innerText = finalKey;
                keyBox.style.display = 'block';
            }
        }, 1000);

        function copyKey() {
            navigator.clipboard.writeText(keyText.innerText);
            alert("Key copied to clipboard!");
        }
    </script>
</body>
</html>
